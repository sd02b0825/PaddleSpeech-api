# PaddleSpeech API 配置文件

# 启动配置
server:
  ip: "0.0.0.0"
  url: "https://d7c08035556848ba91564b7f6c6d1512--8091.ap-shanghai2.cloudstudio.club"
  port: 8091

# mqtt配置
mqtt_server:
  base_url: "http://124.71.81.97:8007"
  key: "ZhuoShang"


# 音频分类检测服务配置
cls_config:
  ip: "127.0.0.1"
  port: 8090
  topk: 3
  temp_dir: "/workspace/temp"
  sample_rate: 16000
  score: 0.3
  labels:
    Shout-呼喊
    Bellow-咆哮
    Yell-叫喊
    Screaming-尖叫
    Crying-哭泣
    Sneeze-打喷嚏
    Slam-猛击
    Explosion-爆炸
    Boom-轰鸣
    Glass-玻璃破碎
    Chink-碰撞声
    Bang-爆裂声
    Breaking-破碎声
    Squeal-尖叫声
    Cough-咳嗽



# 说话声求救检测（分类为说话声且不在 labels 异常列表时走 ASR）
speech_detect:
  enabled: true  # false 时不启用说话声检测 / ASR 求救识别
  speech_labels:
    - Speech
    - Male speech
    - Female speech
    - Child speech
    - Conversation
  distress_keywords:
    - 救命
    - 救我
    - 救命啊
    - 帮帮我
    - 救人
    - 快来人
  distress_label: 求救

# SenseVoice ASR 配置
sensevoice_asr:
  model_path: "/workspace/models/SenseVoiceSmall"  # 本地模型目录
  device: "cpu"          # 或 cuda:0
  language: "auto"       # zh / en / yue / ja / ko / auto
  use_itn: true          # 标点与逆文本归一化

# Sherpa TTS 配置
sherpa_tts:
  acoustic_model_dirname: "matcha-icefall-zh-en"
  vocoder_filename: "vocos-16khz-univ.onnx"
  num_threads: 2
  speed: 1.0
  sid: 0

# TTS 输出目录
tts_output_dir: "/workspace/PaddleSpeech-api/audiofile"

# app服务器
app_server:
  base_url: "http://182.61.31.25:9001"

# 告警确认配置
alarm_confirm:
  enabled: true
  timeout_seconds: 30
  inquiry_template: "{sounds_desc}，您还好吗？需要我帮您通知一下家人吗？"
  confirm_reply: "好的，我已经帮您通知家人了。"
  cancel_reply: "好的，那我就不打扰了，您有需要随时叫我。"
  fallback_direct_alarm: true

